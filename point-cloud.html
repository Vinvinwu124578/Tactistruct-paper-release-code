canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw();};
canvas.onkeydown=e=>{const d={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.15],ArrowDown:[0,.15]}[e.key];if(d){e.preventDefault();az+=d[0];el+=d[1];draw();}};
document.querySelector('#reset').onclick=()=>{az=-.55;el=.38;zoom=1;draw();};
new ResizeObserver(draw).observe(canvas);
draw();document.querySelector('#status').textContent='1,024 points · 40 sampled patches · Exact model input';
})().catch(e=>{document.querySelector('#status').textContent=e.message;throw e;});
</script></html>
