<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tacflow | Reconstructed mesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mesh-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:18px 0 10px}
  .mesh-head h1{font-size:1.55rem;margin-right:auto}
  .mesh-head button,.mesh-head a{font:inherit;border:1px solid #afc0c1;border-radius:5px;background:#fff;color:#1c5d60;padding:5px 10px;text-decoration:none}
  #mesh-scene{width:100%;height:min(70vh,760px);background:#f2f7f6;margin-top:12px;display:block;touch-action:none;cursor:grab}
  #mesh-status{color:#51636a}
  .embedded main{width:100%;padding:8px;display:grid;height:100vh;grid-template-rows:auto auto minmax(0,1fr);gap:4px}
  .embedded .mesh-head{margin:0}
  .embedded .mesh-head h1{font-size:1rem}
  .embedded #input-link{display:none}
  .embedded #mesh-scene{height:100%;margin:0}
</style>
<main>
  <div class="mesh-head">
    <h1>Reconstructed mesh</h1>
    <a id="input-link">Input points</a>
    <button type="button" id="reset" aria-label="Reset view" title="Reset view">&#8634;</button>
  </div>
  <p id="mesh-status" role="status">Loading mesh</p>
  <canvas id="mesh-scene" tabindex="0" aria-label="Interactive reconstruction"></canvas>
</main>
<script type="module" src="mesh-viewer.js"></script>
</html>
