<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tacflow | Reconstructed mesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mesh-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:32px 0 8px}
  .mesh-head h1{margin:0 auto 0 0;font-size:1.6rem;letter-spacing:-.02em}
  .mesh-head button,.mesh-head a{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;color:var(--teal);font-size:.86rem;font-weight:600;text-decoration:none;box-shadow:var(--shadow-sm)}
  .mesh-head button{padding:0;font-size:1.05rem}
  .mesh-head button:hover,.mesh-head a:hover{border-color:var(--teal)}
  #mesh-scene{width:100%;height:min(70vh,760px);background:var(--wash);border-radius:16px;margin-top:14px;display:block;touch-action:none;cursor:grab}
  #mesh-scene:active{cursor:grabbing}
  #mesh-status{color:var(--muted);font-size:.9rem}
  html.embedded,.embedded body{background:var(--wash)}
  .embedded main{position:relative;width:100%;height:100vh;padding:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
  .embedded .mesh-head{position:absolute;top:8px;right:8px;z-index:1;margin:0}
  .embedded .mesh-head h1,.embedded #input-link{display:none}
  .embedded .mesh-head button{width:30px;min-width:30px;height:30px;border-radius:9px;border-color:rgba(16,35,43,.1);background:rgba(255,255,255,.85);box-shadow:none;font-size:.95rem}
  .embedded #mesh-status{grid-row:2;margin:0;padding:0 12px 9px;color:#6b7b80;font-size:.72rem}
  .embedded #mesh-scene{grid-row:1;height:100%;margin:0;border-radius:0}
</style>
<main>
  <div class="mesh-head">
    <h1>Reconstructed mesh</h1>
    <a id="input-link">Input points</a>
    <button type="button" id="reset" aria-label="Reset view" title="Reset view">&#8634;</button>
  </div>
  <p id="mesh-status" role="status">Loading mesh</p>
  <canvas id="mesh-scene" tabindex="0" aria-label="Interactive reconstruction"></canvas>
</main>
<script type="module" src="mesh-viewer.js"></script>
</html>
